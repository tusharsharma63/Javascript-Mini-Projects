<!DOCTYPE html>
<html>
  <head>
    <title>Shipping Calculator</title>
    <style>
      body {
        font-family: Arial;
      }

      .cost-input {
        font-size: 15px;
        /*
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        padding-right: 10px;
        */
        padding: 10px;
      }

      .calculate-button {
        background-color: green;
        color: white;
        border: none;
        font-size: 15px;
        padding: 12px 15px;
        cursor: pointer;
      }

      .js-error-cost {
        color: red;
      }
    </style>
  </head>
  <body>
    <h2>Shipping Calculator</h2>
    <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p>
    <input placeholder="Cost of order"
    class ="js-cost-input cost-input" onkeydown = "
    handleCostKeydown(event);
    ">
    <button onclick="
    calculateTotal();
    " class="calculate-button">Calculate</button>
    <p class="js-total-cost"></p>
    <p class="js-error-cost"></p>

    <script>
      /*
      String(25);
      console.log('25' - 5);
      console.log('25' + 5);

      window.document;
      window.console.log('window');
      window.alert;
      */
      

      function handleCostKeydown(event) {
        if (event.key === 'Enter') {
          calculateTotal(); 
        }
      }

      function calculateTotal() {
        const inputElement = document.querySelector('.js-cost-input');
        let cost = Number(inputElement.value);

        document.querySelector('.js-error-cost')
          .innerHTML = '';

        if (cost < 40 && cost > 0) {
          cost = ((cost * 100) + 1000) / 100;
          document.querySelector('.js-total-cost')
          .innerHTML = `$${cost}`;
        } else if (cost >= 40) {
          document.querySelector('.js-total-cost')
            .innerHTML = `$${cost}`;
        } else {
          document.querySelector('.js-total-cost')
          .innerHTML = '';
          document.querySelector('.js-error-cost')
            .innerHTML = 'Error: cost cannot be less than $0';
        } 
      }
    </script>
  </body>
</html>
